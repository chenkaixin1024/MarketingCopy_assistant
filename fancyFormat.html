<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花式排版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #1E1E1E;
            --white: #FFFFFF;
            --gray: #EFEFEF;
            --gray-dark: #D4D4D4;
            --gray-light: #F7F7F7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--white);
            color: var(--black);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid var(--gray);
            background: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--black);
        }

        .icon-btn:hover {
            background: var(--gray);
        }

        .card {
            background: var(--white);
            border: 1px solid var(--gray);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .textarea-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 16px;
            border: 1px solid var(--gray);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: all 0.2s ease;
            background: var(--white);
            color: var(--black);
            line-height: 1.7;
        }

        textarea:focus {
            border-color: var(--black);
            box-shadow: 0 0 0 3px rgba(30, 30, 30, 0.08);
        }

        textarea::placeholder {
            color: #999;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            outline: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--black);
            color: var(--white);
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--white);
            color: var(--black);
            border: 1px solid var(--gray);
        }

        .btn-secondary:hover {
            background: var(--gray);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .result-section {
            margin-top: 32px;
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .result-title {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-content {
            background: var(--gray-light);
            border: 1px solid var(--gray);
            border-radius: 8px;
            padding: 24px;
            font-size: 15px;
            line-height: 1.8;
            min-height: 120px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .result-content:empty::before {
            content: "等待生成...";
            color: #999;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--black);
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* 弹窗遮罩 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 30, 30, 0.35);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-dialog {
            background: var(--white);
            border: 1px solid var(--gray);
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            margin: 24px;
            padding: 0;
            transform: translateY(12px) scale(0.98);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 60px rgba(30, 30, 30, 0.12);
        }

        .modal-overlay.active .modal-dialog {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px 0;
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 2;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--gray);
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--black);
        }

        .modal-close:hover {
            background: var(--gray);
        }

        .modal-body {
            padding: 20px 24px 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--black);
        }

        .form-hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        input[type="text"],
        input[type="password"],
        input[type="url"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--gray);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
            background: var(--white);
            color: var(--black);
        }

        input:focus {
            border-color: var(--black);
            box-shadow: 0 0 0 3px rgba(30, 30, 30, 0.08);
        }

        .save-btn {
            width: 100%;
            margin-top: 4px;
        }

        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--black);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 200;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--gray);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            color: #666;
            font-size: 14px;
            padding: 16px;
            background: var(--gray);
            border-radius: 8px;
            margin-top: 16px;
            display: none;
        }

        .error-msg.active {
            display: block;
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <!-- 首页 -->
        <div id="homePage">
            <div class="header">
                <div class="logo">花式排版</div>
                <button class="icon-btn" id="configBtn" title="配置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>

            <div class="card">
                <div class="textarea-wrapper">
                    <textarea id="userInput" placeholder="在此输入需要排版的文案..."></textarea>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="formatBtn">
                        <span id="btnText">排版</span>
                    </button>
                </div>
                <div class="error-msg" id="errorMsg"></div>
            </div>

            <div class="result-section" id="resultSection">
                <div class="result-header">
                    <span class="result-title">排版结果</span>
                    <button class="btn btn-secondary" id="regenerateBtn" style="padding: 8px 16px; font-size: 13px;">
                        重新生成
                    </button>
                </div>
                <div class="result-content" id="resultContent"></div>
            </div>
        </div>
    </div>

    <!-- 配置弹窗 -->
    <div class="modal-overlay" id="configModal">
        <div class="modal-dialog" id="modalDialog">
            <div class="modal-header">
                <div class="modal-title">配置</div>
                <button class="modal-close" id="modalCloseBtn" title="关闭">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">API Base URL</label>
                    <input type="url" id="baseUrl" placeholder="https://api.example.com/v1">
                    <div class="form-hint">大模型 API 的基础地址，需以 /v1 结尾</div>
                </div>

                <div class="form-group">
                    <label class="form-label">模型名称</label>
                    <input type="text" id="modelName" placeholder="gpt-4o">
                </div>

                <div class="form-group">
                    <label class="form-label">API Key</label>
                    <input type="password" id="apiKey" placeholder="sk-...">
                    <div class="form-hint">仅存储在本地浏览器，不会上传至任何服务器</div>
                </div>

                <div class="form-group">
                    <label class="form-label">System Prompt</label>
                    <textarea id="systemPrompt" placeholder="将如下文案进行花式排版" style="min-height: 90px; padding: 12px 14px; font-size: 14px;"></textarea>
                    <div class="form-hint">系统提示词，指导模型如何排版</div>
                </div>

                <button class="btn btn-primary save-btn" id="saveConfigBtn">保存配置</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 默认配置
        const DEFAULT_SYSTEM_PROMPT = "将如下文案进行花式排版";

        // DOM 元素
        const configModal = document.getElementById('configModal');
        const modalDialog = document.getElementById('modalDialog');
        const configBtn = document.getElementById('configBtn');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const formatBtn = document.getElementById('formatBtn');
        const regenerateBtn = document.getElementById('regenerateBtn');
        const saveConfigBtn = document.getElementById('saveConfigBtn');
        const userInput = document.getElementById('userInput');
        const resultSection = document.getElementById('resultSection');
        const resultContent = document.getElementById('resultContent');
        const btnText = document.getElementById('btnText');
        const errorMsg = document.getElementById('errorMsg');
        const toast = document.getElementById('toast');

        // 配置输入
        const baseUrlInput = document.getElementById('baseUrl');
        const modelNameInput = document.getElementById('modelName');
        const apiKeyInput = document.getElementById('apiKey');
        const systemPromptInput = document.getElementById('systemPrompt');

        let isGenerating = false;
        let abortController = null;

        // 加载配置
        function loadConfig() {
            const config = JSON.parse(localStorage.getItem('fancyFormatConfig') || '{}');
            baseUrlInput.value = config.baseUrl || '';
            modelNameInput.value = config.modelName || '';
            apiKeyInput.value = config.apiKey || '';
            systemPromptInput.value = config.systemPrompt || DEFAULT_SYSTEM_PROMPT;
        }

        // 获取配置
        function getConfig() {
            return JSON.parse(localStorage.getItem('fancyFormatConfig') || '{}');
        }

        // 显示提示
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // 显示错误
        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('active');
            setTimeout(() => errorMsg.classList.remove('active'), 5000);
        }

        // 打开弹窗
        function openModal() {
            loadConfig();
            configModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            configModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        configBtn.addEventListener('click', openModal);
        modalCloseBtn.addEventListener('click', closeModal);

        // 点击遮罩关闭
        configModal.addEventListener('click', (e) => {
            if (e.target === configModal) {
                closeModal();
            }
        });

        // ESC 关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && configModal.classList.contains('active')) {
                closeModal();
            }
        });

        // 保存配置
        saveConfigBtn.addEventListener('click', () => {
            const config = {
                baseUrl: baseUrlInput.value.trim(),
                modelName: modelNameInput.value.trim(),
                apiKey: apiKeyInput.value.trim(),
                systemPrompt: systemPromptInput.value.trim() || DEFAULT_SYSTEM_PROMPT
            };
            localStorage.setItem('fancyFormatConfig', JSON.stringify(config));
            showToast('配置已保存');
            setTimeout(closeModal, 400);
        });

        // 流式生成
        async function generate() {
            if (isGenerating) return;

            const content = userInput.value.trim();
            if (!content) {
                showError('请输入需要排版的文案');
                return;
            }

            const config = getConfig();
            if (!config.baseUrl || !config.modelName || !config.apiKey) {
                showError('请先完成 API 配置');
                setTimeout(openModal, 800);
                return;
            }

            isGenerating = true;
            abortController = new AbortController();

            // UI 状态
            formatBtn.disabled = true;
            regenerateBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> 生成中...';
            resultSection.classList.add('active');
            resultContent.innerHTML = '<span class="cursor"></span>';
            errorMsg.classList.remove('active');

            let fullText = '';

            try {
                const response = await fetch(config.baseUrl + '/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + config.apiKey
                    },
                    body: JSON.stringify({
                        model: config.modelName,
                        messages: [
                            { role: 'system', content: config.systemPrompt || DEFAULT_SYSTEM_PROMPT },
                            { role: 'user', content: '待排版文案：\n<content>' + content + '</content>' }
                        ],
                        stream: true
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || 'API 请求失败: ' + response.status);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.trim() === '' || line.trim() === 'data: [DONE]') continue;
                        if (!line.startsWith('data: ')) continue;

                        try {
                            const data = JSON.parse(line.slice(6));
                            const delta = data.choices?.[0]?.delta?.content;
                            if (delta) {
                                fullText += delta;
                                resultContent.innerHTML = escapeHtml(fullText) + '<span class="cursor"></span>';
                                resultContent.scrollTop = resultContent.scrollHeight;
                            }
                        } catch (e) {
                            // 忽略解析错误
                        }
                    }
                }

                resultContent.innerHTML = escapeHtml(fullText);
                showToast('排版完成');

            } catch (err) {
                if (err.name === 'AbortError') {
                    resultContent.innerHTML = escapeHtml(fullText) || '已取消';
                } else {
                    showError(err.message || '生成失败，请检查配置');
                    resultContent.innerHTML = escapeHtml(fullText) || '';
                }
            } finally {
                isGenerating = false;
                abortController = null;
                formatBtn.disabled = false;
                regenerateBtn.disabled = false;
                btnText.textContent = '排版';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        formatBtn.addEventListener('click', generate);
        regenerateBtn.addEventListener('click', generate);

        // 初始化
        loadConfig();
    </script>
</body>
</html>
